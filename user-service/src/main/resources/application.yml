server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5434/assignmentdb}
    username: ${APP_DB_USER:appuser}
    password: ${APP_DB_PASSWORD:apppassword}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
    expiration-ms: 3600000
  internal-api-key: ${INTERNAL_API_KEY:internal-dev-key}
